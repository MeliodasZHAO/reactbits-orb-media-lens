<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">Cobalt fluid study</title>
  <desc id="desc">A predominantly cobalt abstract image with cyan glass folds and a soft coral accent.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1727b8"/>
      <stop offset="0.48" stop-color="#385be8"/>
      <stop offset="1" stop-color="#87d8ff"/>
    </linearGradient>
    <radialGradient id="bloom" cx="38%" cy="28%" r="72%">
      <stop offset="0" stop-color="#d9fbff" stop-opacity=".95"/>
      <stop offset=".22" stop-color="#6ce7ff" stop-opacity=".55"/>
      <stop offset=".72" stop-color="#211478" stop-opacity=".18"/>
      <stop offset="1" stop-color="#090634" stop-opacity=".52"/>
    </radialGradient>
    <radialGradient id="coral" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd2d2"/>
      <stop offset=".45" stop-color="#ff8f9f" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ff688b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="texture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .015" numOctaves="3" seed="12" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="86" xChannelSelector="R" yChannelSelector="B"/>
    </filter>
  </defs>
  <rect width="1600" height="1600" fill="url(#background)"/>
  <rect width="1600" height="1600" fill="url(#bloom)"/>
  <ellipse cx="1185" cy="935" rx="440" ry="510" fill="#24116f" opacity=".6" filter="url(#soft)"/>
  <ellipse cx="1140" cy="530" rx="290" ry="360" fill="url(#coral)" opacity=".82" filter="url(#soft)"/>
  <g fill="none" stroke-linecap="round" filter="url(#texture)">
    <path d="M-90 1150C350 680 490 1060 815 725S1180 210 1700 420" stroke="#d8fbff" stroke-opacity=".68" stroke-width="122"/>
    <path d="M-110 1250C320 770 565 1190 930 790S1280 330 1700 520" stroke="#7deaff" stroke-opacity=".5" stroke-width="72"/>
    <path d="M80 1480C430 1090 710 1380 1010 1050S1350 740 1650 800" stroke="#ffffff" stroke-opacity=".2" stroke-width="34"/>
  </g>
  <circle cx="470" cy="435" r="265" fill="none" stroke="#dffcff" stroke-opacity=".22" stroke-width="4"/>
  <circle cx="470" cy="435" r="218" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <path d="M112 1290C470 1485 1000 1510 1474 1248" fill="none" stroke="#0d0a4d" stroke-opacity=".34" stroke-width="2"/>
</svg>
